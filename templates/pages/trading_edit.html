{% extends "base.html" %}
{% load static %}

{% block title %}Edit Item - Trading Post{% endblock title %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <a href="{% url 'trading_detail' post.pk %}" class="btn btn-outline-secondary mb-3">
                <i class="fas fa-arrow-left"></i> Back to Item
            </a>
            
            <div class="card shadow">
                <div class="card-body">
                    <h1 class="mb-4"><i class="fas fa-edit"></i> Edit Item</h1>
                    
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="title" class="form-label">Item Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" required value="{{ post.title }}">
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="faction" class="form-label">Faction <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="faction" name="faction" required value="{{ post.faction }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="condition" class="form-label">Condition <span class="text-danger">*</span></label>
                                <select class="form-select" id="condition" name="condition" required>
                                    <option value="">-- Select --</option>
                                    <option value="new" {% if post.condition == 'new' %}selected{% endif %}>New</option>
                                    <option value="like_new" {% if post.condition == 'like_new' %}selected{% endif %}>Like New</option>
                                    <option value="good" {% if post.condition == 'good' %}selected{% endif %}>Good</option>
                                    <option value="fair" {% if post.condition == 'fair' %}selected{% endif %}>Fair</option>
                                    <option value="poor" {% if post.condition == 'poor' %}selected{% endif %}>Poor</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="price" class="form-label">Price</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="price" name="price" step="0.01" value="{% if post.price %}{{ post.price }}{% endif %}">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="description" name="description" rows="5" required>{{ post.description }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="image" class="form-label">Update Image <span class="text-muted">(Optional)</span></label>
                            {% if post.image %}
                            <div class="mb-2">
                                <img src="{{ post.image.url }}" alt="{{ post.title }}" style="max-width: 100%; height: auto; max-height: 200px;">
                                <p class="small text-muted mt-2">Current image</p>
                            </div>
                            {% endif %}
                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                            <small class="form-text text-muted">Leave blank to keep current image</small>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-lg flex-grow-1">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <a href="{% url 'trading_detail' post.pk %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
